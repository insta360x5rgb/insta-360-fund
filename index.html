<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сбор на Insta360 X5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: #090d16 url('https://images.unsplash.com/photo-1512790182412-b19e6d62bc39?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat fixed;
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
      padding: 20px; 
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      z-index: 1;
    }

    .card { 
      position: relative;
      z-index: 2;
      background: rgba(30, 41, 59, 0.92); 
      border-radius: 20px; 
      padding: 24px; 
      max-width: 420px; 
      width: 100%; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
      border: 1px solid rgba(255,255,255,0.1); 
      text-align: center;
    }

    .camera-img-container {
      margin: 10px 0 16px 0;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(15,23,42,0.6) 80%);
      padding: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .camera-img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    h1 { font-size: 22px; margin-bottom: 6px; color: #ffffff; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
    
    .progress-box { background: rgba(15, 23, 42, 0.8); padding: 16px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #334155; }
    .stats { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; font-weight: 600; }
    .bar-bg { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; }
    .bar-fill { background: linear-gradient(90deg, #00d2ff, #3a7bd5); height: 100%; width: 0%; transition: width 0.4s ease; }
    
    .card-box { background: rgba(15, 23, 42, 0.8); border: 1px dashed #475569; padding: 18px; border-radius: 14px; text-align: center; }
    .card-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .card-num { font-size: 19px; font-weight: bold; letter-spacing: 2px; color: #f8fafc; margin-bottom: 4px; }
    .card-owner { color: #38bdf8; font-size: 14px; margin-bottom: 16px; font-weight: 500; }
    
    .btn-copy { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.2s; }
    .btn-copy:active { transform: scale(0.98); }
  </style>
</head>
<body>

<div class="card">
  <h1>Сбор на Insta360 X5 🎥</h1>
  <p class="sub">Поддержите покупку 8K панорамной экшн-камеры Insta360 X5 для создания крутого контента!</p>

  <!-- Фотография камеры Insta360 X5 -->
  <div class="camera-img-container">
    <img class="camera-img" src="2026-09-03 15.03.22.jpg" alt="Insta360 X5">  
    <div class="progress-box">
    <div class="stats">
      <span>Собрано: <span id="raised" style="color: #38bdf8;">$45</span></span>
      <span>Цель: $500</span>
    </div>
    <div class="bar-bg">
      <div class="bar-fill" id="progress"></div>
    </div>
  </div>

  <div class="card-box">
    <div class="card-label">Карта для перевода</div>
    <div class="card-num" id="cardNumber">9860 1901 0179 6695</div>
    <div class="card-owner">Сундет Бегимбетов</div>
    <button class="btn-copy" onclick="copyCard()">Скопировать номер карты</button>
  </div>
</div>

<script>
  let currentAmount = 45; 
  const goal = 500;function updateProgress() {
    let percentage = Math.min((currentAmount / goal) * 100, 100);
    document.getElementById('raised').innerText = '$' + currentAmount;
    document.getElementById('progress').style.width = percentage + '%';
  }

  function copyCard() {
    const cardNum = document.getElementById('cardNumber').innerText.replace(/\s+/g, '');
    navigator.clipboard.writeText(cardNum).then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.innerText = 'Скопировано! ✓';
      btn.style.background = '#22c55e';
      btn.style.color = '#fff';
      setTimeout(() => {
        btn.innerText = 'Скопировать номер карты';
        btn.style.background = '#38bdf8';
        btn.style.color = '#0f172a';
      }, 2000);
    });
  }

  updateProgress();
</script>

</body>
</html>
